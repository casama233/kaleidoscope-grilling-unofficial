name: Materialize reviewed A2.8.1 vat and icons (one shot)
on:
  push:
    branches: [fix/a281-held-vat-icons]
    paths: ['.github/workflows/a281-materialize.yml']
permissions:
  contents: write
concurrency:
  group: a281-reviewed-materialization
  cancel-in-progress: false
jobs:
  materialize:
    if: github.repository == 'casama233/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch exact reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config core.autocrlf false
          gh auth setup-git
          git remote add origin https://github.com/casama233/kaleidoscope-grilling-unofficial.git
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Materialize only reviewed changes and run source regressions
        run: |
          set -euo pipefail
          python -m pip install Pillow==11.3.0
          python -m py_compile development/gameplay_core/a281_bottle_icons.py development/gameplay_core/a281_visual_contract.py development/gameplay_core/apply_a281_repair.py development/gameplay_core/verify_a281.py
          python development/gameplay_core/apply_a281_repair.py
          python development/gameplay_core/verify_current.py
          python tools/build_grilling_guide.py --check
      - name: Commit checked assets and retire this workflow without force push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/a281-held-vat-icons | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- projects/grilling/gameplay_core projects/grilling/guide/catalog.a3.json development/gameplay_core history/a281-retired .github/workflows README.md
          git diff --cached --stat
          git commit -m 'fix: materialize verified A2.8.1 native vat and bottle icons'
          git push origin HEAD:refs/heads/fix/a281-held-vat-icons
