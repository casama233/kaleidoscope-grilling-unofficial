name: A2.8.1 held-model source audit (read only)
on:
  push:
    branches: [fix/a281-held-vat-icons]
    paths: ['.github/workflows/a281-source-audit.yml']
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'casama233/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Export exact public repository history
        run: |
          set -euo pipefail
          git clone https://github.com/casama233/kaleidoscope-grilling-unofficial.git repo
          cd repo
          git cat-file -e 45b5f8d001fb624fcf49f5503b5e16b81c93b950^{commit}
          git bundle create ../a281-source.bundle --all
          git rev-parse refs/remotes/origin/main > ../snapshot-main.txt
      - name: Export source bundle only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: a281-source
          path: |
            a281-source.bundle
            snapshot-main.txt
          retention-days: 3
          if-no-files-found: error
