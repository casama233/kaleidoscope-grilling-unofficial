name: Grilling Guide A1.13 Player Facing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/guide-a113.yml'
      - 'development/guide/augment_a113.py'
      - 'development/guide/verify_a113.py'
      - 'docs/STATUS-GUIDE-A1.13.md'
  pull_request:
    paths:
      - '.github/workflows/guide-a113.yml'
      - 'development/guide/augment_a113.py'
      - 'development/guide/verify_a113.py'
      - 'docs/STATUS-GUIDE-A1.13.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grilling-guide-a113-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guide-a113:
    if: github.repository == 'casama233/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Read exact confirmed repository commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'casama233/kaleidoscope-grilling-unofficial'
          test "$GITHUB_REPOSITORY_ID" = '1377218440'
          git init .
          git config core.autocrlf false
          git remote add origin https://github.com/casama233/kaleidoscope-grilling-unofficial.git
          git fetch --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify A1.12 guide baseline
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          p=Path('projects/grilling/integration/cookery106')
          bp=json.loads((p/'behavior_pack/manifest.json').read_text(encoding='utf-8-sig'))
          rp=json.loads((p/'resource_pack/manifest.json').read_text(encoding='utf-8-sig'))
          assert bp['header']['version']==[0,1,12]
          assert rp['header']['version']==[0,1,12]
          payload=(p/'behavior_pack/scripts/payload.js').read_text(encoding='utf-8')
          assert '"version": "0.1.12"' in payload
          assert "export const REVISION = 'a1_12_0';" in (p/'behavior_pack/scripts/publisher.js').read_text(encoding='utf-8')
          print('A1.12 guide baseline confirmed')
          '@ | python -

      - name: Apply and verify A1.13 guide polish
        shell: pwsh
        run: |
          python development/guide/augment_a113.py
          python development/guide/verify_a113.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download checksum-pinned official bridge Dash v1.2.0
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dash=Join-Path $env:RUNNER_TEMP 'dash.exe'
          Invoke-WebRequest 'https://github.com/bridge-core/deno-dash-compiler/releases/download/v1.2.0/dash.exe' -OutFile $dash
          if ((Get-FileHash $dash -Algorithm SHA256).Hash.ToLower() -ne '00bb6d984f0ffb819e2fb26c1eda5768db2d6e07a979712e34e1c76c2b7594de') { throw 'Dash checksum mismatch' }

      - name: Compile A1.13 guide with official Dash
        working-directory: projects/grilling/integration/cookery106
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/dash.exe" build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compare compiled guide outputs
        shell: pwsh
        run: |
          python development/guide/verify_a113.py --compiled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package guide addon
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import hashlib,json,os,shutil,zipfile
          root=Path('.');p=root/'projects/grilling/integration/cookery106';art=root/'artifacts';art.mkdir(exist_ok=True)
          def load(x):return json.loads(x.read_text(encoding='utf-8-sig'))
          packs={}
          for name in ('behavior_pack','resource_pack'):
              src=p/name;uid=load(src/'manifest.json')['header']['uuid']
              found=[x.parent for x in (p/'builds/dist').rglob('manifest.json') if load(x).get('header',{}).get('uuid')==uid]
              assert len(found)==1,(name,found);packs[name]=found[0]
          mc=art/'Grilling_Guide_Cookery106_A1.13_Player_Guide.mcaddon'
          with zipfile.ZipFile(mc,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for name,pack in packs.items():
                  for f in sorted(pack.rglob('*')):
                      if f.is_file():z.write(f,name+'/'+f.relative_to(pack).as_posix())
          with zipfile.ZipFile(mc) as z:assert z.testzip() is None
          br=art/'Grilling_Guide_Cookery106_A1.13_Player_Guide.brproject'
          with zipfile.ZipFile(br,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for f in sorted(p.rglob('*')):
                  rel=f.relative_to(p)
                  if f.is_file() and 'builds' not in rel.parts and '.bridge' not in rel.parts:z.write(f,rel.as_posix())
          result={
            'version':'A1.13','tested_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
            'player_facing_guide':True,'entry_count':33,'how_to_entries':6,'recipe_entries':20,'seasoning_entries':7,
            'distinct_how_to_icons':6,'standalone_book_item':False,'host_modified':False,
            'dash_compiled_and_compared':True,
            'mcaddon_sha256':hashlib.sha256(mc.read_bytes()).hexdigest(),
            'brproject_sha256':hashlib.sha256(br.read_bytes()).hexdigest(),
            'minecraft_tested':False,'bds_tested':False
          }
          (p/'a113-ci-result.json').write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          for q in (p/'builds',p/'.bridge'):
              if q.exists():shutil.rmtree(q)
          '@ | python -

      - name: Publish A1.13 generated guide and artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- projects/grilling/integration/cookery106             artifacts/Grilling_Guide_Cookery106_A1.13_Player_Guide.mcaddon             artifacts/Grilling_Guide_Cookery106_A1.13_Player_Guide.brproject
          git diff --cached --name-only | python -c 'import sys; p=sys.stdin.read().splitlines(); ok=("projects/grilling/integration/cookery106/","artifacts/Grilling_Guide_Cookery106_A1.13_Player_Guide."); assert p and all(x.startswith(ok) for x in p)'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: publish A1.13 player-facing guide'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:main
          unset AUTH

      - name: Upload A1.13 review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Grilling-Guide-Cookery106-A1.13-Player-Guide
          path: |
            artifacts/Grilling_Guide_Cookery106_A1.13_Player_Guide.mcaddon
            artifacts/Grilling_Guide_Cookery106_A1.13_Player_Guide.brproject
            projects/grilling/integration/cookery106/a113-*.json
          retention-days: 14
          if-no-files-found: error
