name: A2.4 Gameplay Core
on:
  push:
    branches:
      - a2.4-threading-secret-skewer
    paths:
      - '.github/workflows/gameplay-core-a24.yml'
      - 'development/gameplay_core/test_a24_*'
      - 'development/gameplay_core/verify_a24.py'
      - 'projects/grilling/gameplay_core/**'
      - 'docs/STATUS-A2.4.md'
  pull_request:
    paths:
      - '.github/workflows/gameplay-core-a24.yml'
      - 'development/gameplay_core/test_a24_*'
      - 'development/gameplay_core/verify_a24.py'
      - 'projects/grilling/gameplay_core/**'
      - 'docs/STATUS-A2.4.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: grilling-gameplay-core-a24-${{ github.ref }}
  cancel-in-progress: true
jobs:
  a24:
    if: github.repository == 'casama233/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Read exact repository commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git config core.autocrlf false
          git remote add origin https://github.com/casama233/kaleidoscope-grilling-unofficial.git
          git fetch --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Test Java 1.1.1 threading rules
        shell: pwsh
        run: |
          node development/gameplay_core/test_a24_skewer_rules.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Syntax-check A2.4 scripts
        shell: pwsh
        run: |
          node --check projects/grilling/gameplay_core/behavior_pack/scripts/a24_skewer_rules.js
          node --check projects/grilling/gameplay_core/behavior_pack/scripts/a24_skewering.js
          node --check projects/grilling/gameplay_core/behavior_pack/scripts/main.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate A2.4 structure and dependencies
        shell: pwsh
        run: |
          python development/gameplay_core/verify_a24.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download checksum-pinned official bridge Dash v1.2.0
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dash=Join-Path $env:RUNNER_TEMP 'dash.exe'
          Invoke-WebRequest 'https://github.com/bridge-core/deno-dash-compiler/releases/download/v1.2.0/dash.exe' -OutFile $dash
          if ((Get-FileHash $dash -Algorithm SHA256).Hash.ToLower() -ne '00bb6d984f0ffb819e2fb26c1eda5768db2d6e07a979712e34e1c76c2b7594de') { throw 'Dash checksum mismatch' }
      - name: Compile A2.4 with official Dash
        working-directory: projects/grilling/gameplay_core
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/dash.exe" build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
