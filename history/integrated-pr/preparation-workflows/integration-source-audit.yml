name: Grilling integration source audit (read only)
on:
  push:
    branches: [fix/a2771-integrated-test]
    paths: ['.github/workflows/integration-source-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'casama233/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Snapshot public source history without credentials or working data
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git config core.autocrlf false
          git remote add origin https://github.com/casama233/kaleidoscope-grilling-unofficial.git
          git fetch origin "$EXPECTED_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python - <<'PY'
          import json,subprocess
          refs={
           'main':'d1843d246e3af8cccd98d23b84450e75673a3737',
           'pr1':'8415cb4adbfc5be4b1bf6c7fe4e49b40427be6d0',
           'pr5':'08e1d50d792fdaf15591c03f8636da944b150769',
           'pr6':'e825539945206de2bcc60aaa6afe926c45d7e6b2',
           'pr69':'a60b97ee36a2706742419a8262fc88033dc1d48e',
           'pr74':'fca605c2401ce6574c5a74f21c8c3874573e16d7',
           'placed':'38d79494f2ac9bc970c3d05748ae21fca9fb8101',
          }
          def git(*args):return subprocess.check_output(['git',*args],text=True)
          for name,sha in refs.items():
           subprocess.run(['git','fetch','origin',sha],check=True)
           subprocess.run(['git','update-ref','refs/audit/'+name,sha],check=True)
          for name,sha in refs.items():
           if name=='main':continue
           base=git('merge-base',refs['main'],sha).strip()
           diff=git('diff','--name-status',base,sha)
           print('AUDIT',name,'HEAD',sha,'BASE',base,'\n'+diff)
           result=subprocess.run(['git','merge-tree','--write-tree',refs['main'],sha],text=True,capture_output=True)
           print('MERGE_TREE',name,'exit',result.returncode,'\n'+result.stdout[-18000:])
          subprocess.run(['git','bundle','create','integration-source.bundle',*['refs/audit/'+name for name in refs]],check=True)
          open('integration-refs.json','w').write(json.dumps(refs,indent=2)+'\n')
          PY
      - name: Retain repository source only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: grilling-integration-source
          path: |
            integration-source.bundle
            integration-refs.json
          retention-days: 3
          if-no-files-found: error
