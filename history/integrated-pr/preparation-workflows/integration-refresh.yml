name: Pin refreshed integration heads (read only)
on:
  push:
    branches: [fix/a2771-integrated-test]
    paths: ['.github/workflows/integration-refresh.yml']
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'casama233/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Snapshot public Git objects only
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/casama233/kaleidoscope-grilling-unofficial.git
          git fetch origin refs/heads/main:refs/audit/latest-main refs/pull/74/head:refs/audit/latest-pr74
          git bundle create integration-refresh.bundle refs/audit/latest-main refs/audit/latest-pr74
          git show-ref > snapshot-refs.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: grilling-integration-refresh
          path: |
            integration-refresh.bundle
            snapshot-refs.txt
          retention-days: 3
          if-no-files-found: error
