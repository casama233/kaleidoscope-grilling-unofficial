name: Import exact A2.8.8 local review source

on:
  push:
    branches: ['codex/grilling-a288-local-review']
    paths:
      - '.a288-upload/**'
      - '.github/workflows/upload-a288-local-review.yml'

permissions:
  contents: write

concurrency:
  group: grilling-a288-source-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'casama233/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440' && github.ref == 'refs/heads/codex/grilling-a288-local-review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Read exact review-branch commit and frozen baseline
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'casama233/kaleidoscope-grilling-unofficial'
          test "$GITHUB_REPOSITORY_ID" = '1377218440'
          test "$GITHUB_REF" = 'refs/heads/codex/grilling-a288-local-review'
          git init .
          git config core.autocrlf false
          git remote add origin https://github.com/casama233/kaleidoscope-grilling-unofficial.git
          git fetch --depth=1 origin "$EXPECTED_SHA" 707d28edab4ea9af76878e0e29d8244848971db3
          git checkout --detach "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Restore source and verify every before and after checksum
        run: python .a288-upload/import.py
      - name: Commit only the verified 26 files to the review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/codex/grilling-a288-local-review'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(grilling): import exact A2.8.8 transaction and scheduler review'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:codex/grilling-a288-local-review
          unset AUTH
