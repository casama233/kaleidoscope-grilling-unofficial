name: A2.7.27 + Guide A1.14 Localization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localization-a2727-a114.yml'
      - 'development/gameplay_core/augment_a2727.py'
      - 'development/gameplay_core/verify_a2727.py'
      - 'development/guide/augment_a114.py'
      - 'development/guide/verify_a114.py'
      - 'docs/STATUS-LOCALIZATION-A2.7.27-A1.14.md'
  pull_request:
    paths:
      - '.github/workflows/localization-a2727-a114.yml'
      - 'development/gameplay_core/augment_a2727.py'
      - 'development/gameplay_core/verify_a2727.py'
      - 'development/guide/augment_a114.py'
      - 'development/guide/verify_a114.py'
      - 'docs/STATUS-LOCALIZATION-A2.7.27-A1.14.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grilling-localization-a2727-a114-${{ github.ref }}
  cancel-in-progress: false

jobs:
  localization:
    if: github.repository == 'casama233/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Read exact confirmed repository commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'casama233/kaleidoscope-grilling-unofficial'
          test "$GITHUB_REPOSITORY_ID" = '1377218440'
          git init .
          git config core.autocrlf false
          git remote add origin https://github.com/casama233/kaleidoscope-grilling-unofficial.git
          git fetch --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify published baselines
        shell: pwsh
        run: |
          python development/gameplay_core/verify_a2726.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import json
          from pathlib import Path
          p=Path('projects/grilling/integration/cookery106')
          bp=json.loads((p/'behavior_pack/manifest.json').read_text(encoding='utf-8-sig'))
          rp=json.loads((p/'resource_pack/manifest.json').read_text(encoding='utf-8-sig'))
          assert bp['header']['version']==[0,1,13] and rp['header']['version']==[0,1,13]
          assert '"version": "0.1.13"' in (p/'behavior_pack/scripts/payload.js').read_text(encoding='utf-8')
          assert "export const REVISION = 'a1_13_0';" in (p/'behavior_pack/scripts/publisher.js').read_text(encoding='utf-8')
          print('A2.7.26 + Guide A1.13 baselines confirmed')
          '@ | python -

      - name: Apply localization updates
        shell: pwsh
        run: |
          python development/gameplay_core/augment_a2727.py
          python development/gameplay_core/verify_a2727.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/guide/augment_a114.py
          python development/guide/verify_a114.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download checksum-pinned official bridge Dash v1.2.0
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dash=Join-Path $env:RUNNER_TEMP 'dash.exe'
          Invoke-WebRequest 'https://github.com/bridge-core/deno-dash-compiler/releases/download/v1.2.0/dash.exe' -OutFile $dash
          if ((Get-FileHash $dash -Algorithm SHA256).Hash.ToLower() -ne '00bb6d984f0ffb819e2fb26c1eda5768db2d6e07a979712e34e1c76c2b7594de') { throw 'Dash checksum mismatch' }

      - name: Compile Gameplay Core localization
        working-directory: projects/grilling/gameplay_core
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/dash.exe" build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile Guide localization
        working-directory: projects/grilling/integration/cookery106
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/dash.exe" build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compare compiled outputs
        shell: pwsh
        run: |
          python development/gameplay_core/verify_a2727.py --compiled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/guide/verify_a114.py --compiled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package localized addons
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import hashlib,json,os,shutil,zipfile
          root=Path('.');art=root/'artifacts';art.mkdir(exist_ok=True)
          def load(x):return json.loads(x.read_text(encoding='utf-8-sig'))
          def package(project, stem):
              packs={}
              for name in ('behavior_pack','resource_pack'):
                  src=project/name;uid=load(src/'manifest.json')['header']['uuid']
                  found=[x.parent for x in (project/'builds/dist').rglob('manifest.json') if load(x).get('header',{}).get('uuid')==uid]
                  assert len(found)==1,(name,found);packs[name]=found[0]
              mc=art/(stem+'.mcaddon')
              with zipfile.ZipFile(mc,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
                  for name,pack in packs.items():
                      for f in sorted(pack.rglob('*')):
                          if f.is_file():z.write(f,name+'/'+f.relative_to(pack).as_posix())
              with zipfile.ZipFile(mc) as z:assert z.testzip() is None
              br=art/(stem+'.brproject')
              with zipfile.ZipFile(br,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
                  for f in sorted(project.rglob('*')):
                      rel=f.relative_to(project)
                      if f.is_file() and 'builds' not in rel.parts and '.bridge' not in rel.parts:z.write(f,rel.as_posix())
              return mc,br
          gmc,gbr=package(root/'projects/grilling/gameplay_core','Kaleidoscope_Grilling_A2.7.27_Localization')
          qmc,qbr=package(root/'projects/grilling/integration/cookery106','Grilling_Guide_Cookery106_A1.14_Localized')
          result={
            'gameplay_version':'A2.7.27','guide_version':'A1.14','tested_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
            'gameplay_language_files':['zh_CN','zh_TW','en_US'],'gameplay_language_keys':96,
            'guide_language_files':['zh_CN','zh_TW','en_US'],'guide_localized_entries':33,
            'guide_runtime_labels_follow_host_language':True,
            'guide_runtime_body_locale_switch_stock_cookery_1_0_6':False,
            'host_limitation':'mechanicsByLocale locale-key normalization bug in stock Cookery 1.0.6; per-player extension body language cannot be fixed safely in the child addon alone',
            'dash_compiled_and_compared':True,
            'gameplay_mcaddon_sha256':hashlib.sha256(gmc.read_bytes()).hexdigest(),
            'guide_mcaddon_sha256':hashlib.sha256(qmc.read_bytes()).hexdigest(),
            'minecraft_tested':False,'bds_tested':False
          }
          (root/'projects/grilling/integration/cookery106'/'a114-ci-result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          for p in (root/'projects/grilling/gameplay_core',root/'projects/grilling/integration/cookery106'):
              for q in (p/'builds',p/'.bridge'):
                  if q.exists():shutil.rmtree(q)
          '@ | python -

      - name: Publish localized sources and artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- projects/grilling/gameplay_core projects/grilling/integration/cookery106             artifacts/Kaleidoscope_Grilling_A2.7.27_Localization.mcaddon             artifacts/Kaleidoscope_Grilling_A2.7.27_Localization.brproject             artifacts/Grilling_Guide_Cookery106_A1.14_Localized.mcaddon             artifacts/Grilling_Guide_Cookery106_A1.14_Localized.brproject
          git diff --cached --name-only | python -c 'import sys; p=sys.stdin.read().splitlines(); ok=("projects/grilling/gameplay_core/","projects/grilling/integration/cookery106/","artifacts/Kaleidoscope_Grilling_A2.7.27_Localization.","artifacts/Grilling_Guide_Cookery106_A1.14_Localized."); assert p and all(x.startswith(ok) for x in p)'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: publish A2.7.27 and Guide A1.14 localization'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:main
          unset AUTH

      - name: Upload localization review artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Grilling-Localization-A2.7.27-A1.14
          path: |
            artifacts/Kaleidoscope_Grilling_A2.7.27_Localization.mcaddon
            artifacts/Kaleidoscope_Grilling_A2.7.27_Localization.brproject
            artifacts/Grilling_Guide_Cookery106_A1.14_Localized.mcaddon
            artifacts/Grilling_Guide_Cookery106_A1.14_Localized.brproject
            projects/grilling/gameplay_core/reports/a2727-*.json
            projects/grilling/integration/cookery106/a114-*.json
          retention-days: 14
          if-no-files-found: error
