name: Assemble reviewed A2.8.0 integration (one shot)
on:
  push:
    branches: [fix/a2771-integrated-test]
    paths:
      - '.github/workflows/integration-assemble.yml'
      - 'development/integration/assemble_a280.py'
      - 'development/integration/integration_finish_a280.py'
permissions:
  contents: write
concurrency:
  group: grilling-a280-reviewed-integration
  cancel-in-progress: false
jobs:
  assemble:
    if: github.repository == 'casama233/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Fetch exact reviewed source histories
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git config core.autocrlf false
          git remote add origin https://github.com/casama233/kaleidoscope-grilling-unofficial.git
          git fetch origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import subprocess
          refs={
           'main':'d1843d246e3af8cccd98d23b84450e75673a3737',
           'pr1':'8415cb4adbfc5be4b1bf6c7fe4e49b40427be6d0',
           'pr5':'08e1d50d792fdaf15591c03f8636da944b150769',
           'pr6':'e825539945206de2bcc60aaa6afe926c45d7e6b2',
           'pr69':'a60b97ee36a2706742419a8262fc88033dc1d48e',
           'pr74':'fca605c2401ce6574c5a74f21c8c3874573e16d7',
           'latest-pr74':'243403394dae5a41a2c830d0417a12c55e2d0b87',
           'placed':'38d79494f2ac9bc970c3d05748ae21fca9fb8101',
           'placed-fixed':'c1d8e954fe524134bdf430594e7fc5856ad063a8',
          }
          for name,sha in refs.items():
           subprocess.run(['git','fetch','origin',sha],check=True)
           subprocess.run(['git','update-ref','refs/audit/'+name,sha],check=True)
          PY
      - name: Resolve pinned PRs and materialize derived visual resources
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install Pillow==11.3.0
          python -m py_compile development/integration/assemble_a280.py development/integration/integration_finish_a280.py
          python development/integration/assemble_a280.py
          python development/gameplay_core/verify_current.py
      - name: Commit checked resolution with original PR ancestry (no force push)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,subprocess
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          expected={
           'refs/heads/main':'d1843d246e3af8cccd98d23b84450e75673a3737',
           'refs/heads/fix/a2771-integrated-test':os.environ['GITHUB_SHA'],
           'refs/pull/1/head':'8415cb4adbfc5be4b1bf6c7fe4e49b40427be6d0',
           'refs/pull/5/head':'08e1d50d792fdaf15591c03f8636da944b150769',
           'refs/pull/6/head':'e825539945206de2bcc60aaa6afe926c45d7e6b2',
           'refs/pull/69/head':'a60b97ee36a2706742419a8262fc88033dc1d48e',
           'refs/pull/74/head':'243403394dae5a41a2c830d0417a12c55e2d0b87',
           'refs/heads/fix/a2770-placed-visuals':'c1d8e954fe524134bdf430594e7fc5856ad063a8',
          }
          rows=git('ls-remote','origin',*expected).splitlines()
          actual={line.split()[1]:line.split()[0] for line in rows}
          assert actual==expected,('concurrent update: re-review before writing',actual,expected)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -p "$GITHUB_SHA" -p refs/audit/pr1 -p refs/audit/pr5 -p refs/audit/pr6 -p refs/audit/pr69 -p refs/audit/latest-pr74 -p refs/audit/placed-fixed -m 'release: integrate all reviewed PR histories into A2.8.0 test candidate')
          gh auth setup-git
          git push origin "$commit:refs/heads/fix/a2771-integrated-test"
          echo "VERIFIED_INTEGRATION_HEAD=$commit"
