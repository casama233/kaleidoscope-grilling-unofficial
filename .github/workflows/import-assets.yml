name: Import verified Grilling assets
on:
  push:
    paths:
      - '.github/workflows/import-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: grilling-asset-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'casama233/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read exact public commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'casama233/kaleidoscope-grilling-unofficial'
          test "$GITHUB_REPOSITORY_ID" = '1377218440'
          git init .
          git remote add origin https://github.com/casama233/kaleidoscope-grilling-unofficial.git
          git fetch --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install deterministic offline asset tooling dependencies
        run: python -m pip install 'numpy==2.3.5' 'Pillow==12.3.0'
      - name: Verify capsule, retrieve approved sources, rebuild and compare
        run: python migration/bootstrap.py
      - name: Validate notebook independently
        run: node notebook/test.mjs
      - name: Commit only the verified project and result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'casama233/kaleidoscope-grilling-unofficial'
          test "$GITHUB_REPOSITORY_ID" = '1377218440'
          find projects/grilling -type d -name __pycache__ -prune -exec rm -rf {} +
          git add -- projects/grilling migration/result.json
          git diff --cached --name-only | python -c 'import sys; paths=sys.stdin.read().splitlines(); assert paths and all(p.startswith("projects/grilling/") or p=="migration/result.json" for p in paths)'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'import: verified A1.12 source assets, 366 model pairs, 156 atlases and guide runtime'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:main
          unset AUTH
