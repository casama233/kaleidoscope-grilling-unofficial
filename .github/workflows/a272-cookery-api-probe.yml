name: A2.7.2 Cookery API Probe
on:
  push:
    branches: [a272-cookery-processing]
    paths:
      - '.github/workflows/a272-cookery-api-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'casama233/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download exact public Cookery 1.0.6 and print public API contract
        shell: bash
        run: |
          set -euo pipefail
          expected='c589efb60277bea295ac12ef760d8f2c7e8af3ea62e809b320862bd786033351'
          name='Kaleidoscope Cookery v1.0.6.mcaddon'
          urls=(
            'https://mediafilez.forgecdn.net/files/8908/596/Kaleidoscope%20Cookery%20v1.0.6.mcaddon'
            'https://media.forgecdn.net/files/8908/596/Kaleidoscope%20Cookery%20v1.0.6.mcaddon'
            'https://edge.forgecdn.net/files/8908/596/Kaleidoscope%20Cookery%20v1.0.6.mcaddon'
            'https://www.curseforge.com/api/v1/mods/1673664/files/8908596/download'
          )
          ok=0
          for u in "${urls[@]}"; do
            echo "::notice::Trying public CurseForge file endpoint"
            rm -f cookery.mcaddon
            if curl --retry 2 --retry-delay 1 -fL --connect-timeout 15 --max-time 120 "$u" -o cookery.mcaddon; then
              got=$(sha256sum cookery.mcaddon | awk '{print $1}')
              echo "sha256=$got size=$(stat -c%s cookery.mcaddon)"
              if [ "$got" = "$expected" ]; then ok=1; break; fi
            fi
          done
          test "$ok" = 1
          python - <<'PY'
          import io, zipfile
          outer='cookery.mcaddon'
          wanted=('documentation/KC_EXTENSION_API.md','scripts/api/extensionRegistry.js')
          found={}
          def scan(z,prefix=''):
              for n in z.namelist():
                  low=n.replace('\\','/')
                  for w in wanted:
                      if low.endswith(w):
                          found[w]=z.read(n).decode('utf-8','replace')
                  if n.lower().endswith(('.mcpack','.zip')):
                      try:
                          scan(zipfile.ZipFile(io.BytesIO(z.read(n))),prefix+n+'!')
                      except zipfile.BadZipFile:
                          pass
          with zipfile.ZipFile(outer) as z: scan(z)
          for w in wanted:
              print(f'\n===== BEGIN {w} =====')
              print(found.get(w,'NOT FOUND'))
              print(f'===== END {w} =====')
          assert all(w in found for w in wanted),found.keys()
          PY
