name: Recover reviewed placed visual assets (read only)
on:
  push:
    branches: [fix/a2771-integrated-test]
    paths: ['.github/workflows/integration-asset-audit.yml']
permissions:
  contents: read
jobs:
  assets:
    if: github.repository == 'casama233/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Read exact source, recover fixtures and check syntax
        shell: bash
        run: |
          set -euo pipefail
          git init source
          cd source
          git config core.autocrlf false
          git remote add origin https://github.com/casama233/kaleidoscope-grilling-unofficial.git
          git fetch --depth=1 origin 38d79494f2ac9bc970c3d05748ae21fca9fb8101
          git checkout --detach FETCH_HEAD
          python -m pip install Pillow==11.3.0
          python - <<'PY'
          from pathlib import Path
          p=Path('projects/grilling/gameplay_core/behavior_pack/scripts/a2770_placed_visual_core.js')
          s=p.read_text();old='[-4.25,-3.25]];'
          assert s.count(old)==1
          p.write_text(s.replace(old,'[-4.25,-3.25]]];'))
          PY
          node --check projects/grilling/gameplay_core/behavior_pack/scripts/a2770_placed_visual_core.js
          node development/gameplay_core/test_a2770_core.mjs
          python development/gameplay_core/a2770_placed_visual_assets.py --fetch-sources
          python development/gameplay_core/a2770_placed_visual_assets.py --check
          python - <<'PY'
          import pathlib,zipfile,json,hashlib
          root=pathlib.Path('.')
          roots=['development/gameplay_core/fixtures/a2770','projects/grilling/gameplay_core/resource_pack/models/entity/a2770_placed','projects/grilling/gameplay_core/resource_pack/textures/a2770_placed']
          files=[p for r in roots for p in (root/r).rglob('*') if p.is_file()]
          files += list(root.glob('projects/grilling/gameplay_core/resource_pack/entity/a2770*'))
          files += list(root.glob('projects/grilling/gameplay_core/behavior_pack/entities/a2770*'))
          files += [root/'projects/grilling/gameplay_core/resource_pack/render_controllers/a2770_placed.render_controllers.json',root/'projects/grilling/gameplay_core/behavior_pack/scripts/a2770_placed_visual_data.js']
          with zipfile.ZipFile('../placed-source-assets.zip','w',zipfile.ZIP_DEFLATED) as z:
           for p in sorted(files):z.write(p,p.as_posix())
          print('FILES',len(files),'SHA256',hashlib.sha256(pathlib.Path('../placed-source-assets.zip').read_bytes()).hexdigest())
          PY
      - name: Keep only attributed source fragments and generated visuals
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: grilling-placed-source-assets
          path: placed-source-assets.zip
          retention-days: 3
          if-no-files-found: error
