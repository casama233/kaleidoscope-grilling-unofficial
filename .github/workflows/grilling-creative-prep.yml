name: Prepare Grilling creative groups (one-shot)
on:
  push:
    branches: [fix/grilling-creative-groups]
    paths: ['.github/workflows/grilling-creative-prep.yml', 'development/gameplay_core/a2770_creative_catalog.py', 'development/gameplay_core/verify_a2770.py', 'development/gameplay_core/test_a2770_catalog.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: grilling-creative-prep
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'casama233/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440' && github.ref == 'refs/heads/fix/grilling-creative-groups'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Read exact branch commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'casama233/kaleidoscope-grilling-unofficial'
          test "$GITHUB_REPOSITORY_ID" = '1377218440'
          git init .
          git config core.autocrlf false
          git remote add origin https://github.com/casama233/kaleidoscope-grilling-unofficial.git
          git fetch --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Preserve original locale newlines in the generator
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('development/gameplay_core/a2770_creative_catalog.py')
          s=path.read_text(encoding='utf-8')
          old="    return '\\n'.join(kept) + '\\n'"
          new="    newline = '\\r\\n' if '\\r\\n' in text else '\\n'\n    return newline.join(kept) + newline"
          assert s.count(old)==1
          s=s.replace(old,new)
          old="pending[path]=localized(path.read_text(encoding='utf-8-sig'),locale,active)"
          new="pending[path]=localized(path.read_bytes().decode('utf-8-sig'),locale,active)"
          assert s.count(old)==1
          path.write_text(s.replace(old,new),encoding='utf-8')
          path=Path('development/gameplay_core/test_a2770_catalog.py')
          s=path.read_text(encoding='utf-8')
          old="self.assertIn('other:item=unchanged\\n',result)"
          assert s.count(old)==1
          path.write_text(s.replace(old,"self.assertIn('other:item=unchanged',result.splitlines())"),encoding='utf-8')
          PY
      - name: Generate and verify creative-only metadata
        run: |
          set -euo pipefail
          python development/gameplay_core/test_a2770_catalog.py
          python development/gameplay_core/a2770_creative_catalog.py --apply
          python development/gameplay_core/verify_current.py
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --check
      - name: Commit verified changes to this review branch only; retire preparation workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          git rm -- .github/workflows/grilling-creative-prep.yml
          git add -- projects/grilling/gameplay_core development/gameplay_core/verify_current.py development/gameplay_core/verify_a2769.py development/gameplay_core/a2770_creative_catalog.py development/gameplay_core/test_a2770_catalog.py
          git commit -m 'release: A2.7.70 group Grilling creative items by use'
          git push origin HEAD:refs/heads/fix/grilling-creative-groups
