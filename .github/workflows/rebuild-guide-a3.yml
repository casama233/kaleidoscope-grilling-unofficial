name: Rebuild Grilling Guide A3 Once
on:
  push:
    branches: [codex/a2761-runtime-hygiene]
    paths: ['.github/workflows/rebuild-guide-a3.yml']
permissions:
  contents: write
jobs:
  rebuild:
    if: github.repository == 'casama233/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440' && github.ref == 'refs/heads/codex/a2761-runtime-hygiene'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Read exact review-branch commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'casama233/kaleidoscope-grilling-unofficial'
          test "$GITHUB_REPOSITORY_ID" = '1377218440'
          git init .
          git config core.autocrlf false
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$EXPECTED_SHA"
          git checkout -B codex/a2761-runtime-hygiene FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Read pinned Cookery taxonomy and generate guide-only content
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://mediafilez.forgecdn.net/files/8908/596/Kaleidoscope%20Cookery%20v1.0.6.mcaddon' --output "$RUNNER_TEMP/cookery-reference.mcaddon"
          python - <<'PY'
          import hashlib, json, os, subprocess, sys, zipfile
          from pathlib import Path, PurePosixPath
          archive=Path(os.environ['RUNNER_TEMP'])/'cookery-reference.mcaddon'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='c589efb60277bea295ac12ef760d8f2c7e8af3ea62e809b320862bd786033351'
          folder=Path(os.environ['RUNNER_TEMP'])/'cookery-guide-reference'
          with zipfile.ZipFile(archive) as z:
              targets=[n for n in z.namelist() if n.endswith('/scripts/events/guidebook.js')]
              assert len(targets)==1, targets
              prefix=targets[0].split('/scripts/events/guidebook.js')[0]
              for name in z.namelist():
                  parts=PurePosixPath(name).parts
                  assert '..' not in parts and not PurePosixPath(name).is_absolute()
                  if name.startswith(prefix+'/'):z.extract(name,folder)
          host=folder/prefix
          assert json.loads((host/'manifest.json').read_text(encoding='utf-8-sig'))['header']['uuid']=='10f37ae2-9ccf-435f-b34b-0eec8191cd94'
          subprocess.run([sys.executable,'development/guide/rebuild_catalog_a3.py','--host-bp',str(host)],check=True)
          project=Path('projects/grilling/integration/cookery106')
          rp_uuid='32baef08-6b04-5115-9d5b-2d4ba2d3a7b4'
          for name,uid in [('behavior_pack','f8c367c2-84d6-5bf6-b5a8-1bbe6cdb93ab'),('resource_pack',rp_uuid)]:
              path=project/name/'manifest.json';doc=json.loads(path.read_text(encoding='utf-8-sig'))
              assert doc['header']['uuid']==uid
              doc['header']['version']=[0,3,0]
              doc['header']['name']='Grilling Guide A3.0 — Cookery-style Encyclopedia '+('BP' if name=='behavior_pack' else 'RP')
              doc['header']['description']='Cookery-style categories; item acquisition, recipes, controls and effects in one guide entry.'
              for module in doc['modules']:module['version']=[0,3,0]
              for dep in doc.get('dependencies',[]):
                  if dep.get('uuid')==rp_uuid:dep['version']=[0,3,0]
              path.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          pub=project/'behavior_pack/scripts/publisher.js';text=pub.read_text(encoding='utf-8')
          assert "REVISION = 'a2_0_0'" in text
          pub.write_text(text.replace("REVISION = 'a2_0_0'","REVISION = 'a3_0_0'"),encoding='utf-8')
          config=project/'config.json';doc=json.loads(config.read_text(encoding='utf-8-sig'))
          doc['name']='Grilling Guide A3.0 — Cookery-style Encyclopedia'
          doc['description']='One Grilling entry in Cookery: item-centric catalog, native parent categories, recipes and actual item icons.'
          doc['compiler']['plugins'][0][1]['packName']='KG_Grilling_Guide_A3_0_Encyclopedia'
          config.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python tools/build_grilling_guide.py
          python tools/check_grilling_guide.py
          python tools/build_grilling_guide_release.py --output "$RUNNER_TEMP/Grilling_Guide_A3_0.mcaddon"
          git diff --check
      - name: Commit only the guide catalog and generated guide resources
        shell: bash
        run: |
          set -euo pipefail
          git add projects/grilling/guide/catalog.a3.json projects/grilling/integration/cookery106/behavior_pack projects/grilling/integration/cookery106/resource_pack projects/grilling/integration/cookery106/config.json docs/GUIDE-INDEX-A3.md
          python - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          allowed=('projects/grilling/guide/catalog.a3.json','projects/grilling/integration/cookery106/','docs/GUIDE-INDEX-A3.md')
          assert names and all(n.startswith(allowed) for n in names), names
          PY
          git config user.name 'grilling-guide-migration[bot]'
          git config user.email 'grilling-guide-migration[bot]@users.noreply.github.com'
          git commit -m 'guide: replace five tutorial chapters with Cookery-style item encyclopedia'
          git push origin HEAD:refs/heads/codex/a2761-runtime-hygiene
