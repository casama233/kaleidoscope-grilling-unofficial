name: Apply Cookery shared creative groups (one-shot)
on:
  push:
    branches: [fix/grilling-creative-groups]
    paths:
      - '.github/workflows/grilling-shared-prep.yml'
      - 'development/gameplay_core/a2771_shared_creative.py'
      - 'development/gameplay_core/test_a2771_catalog.py'
      - 'development/gameplay_core/verify_a2771.py'
permissions:
  contents: write
  actions: read
concurrency:
  group: grilling-shared-catalog-prep
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'casama233/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440' && github.ref == 'refs/heads/fix/grilling-creative-groups'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Read exact authorized branch commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'casama233/kaleidoscope-grilling-unofficial'
          test "$GITHUB_REPOSITORY_ID" = '1377218440'
          git init .
          git config core.autocrlf false
          git remote add origin https://github.com/casama233/kaleidoscope-grilling-unofficial.git
          git fetch --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Read the already-inspected public-pack metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 36136376708 --repo "$GITHUB_REPOSITORY" --name kaleidoscope-series-reference-metadata --dir "$RUNNER_TEMP/grilling-series-reference"
      - name: Replace independent groups and verify against real host catalogs
        run: |
          set -euo pipefail
          python -m py_compile development/gameplay_core/a2771_shared_creative.py development/gameplay_core/test_a2771_catalog.py development/gameplay_core/verify_a2771.py
          python development/gameplay_core/a2771_shared_creative.py --apply --references "$RUNNER_TEMP/grilling-series-reference/reference-audit.json"
          python development/gameplay_core/verify_current.py
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --check
      - name: Commit only verified changes; remove both temporary workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          git rm -- .github/workflows/grilling-series-reference.yml .github/workflows/grilling-shared-prep.yml
          git add -- projects/grilling/gameplay_core development/gameplay_core/verify_current.py development/gameplay_core/fixtures/a2771-series-catalogs.json
          git commit -m 'fix: A2.7.71 append Grilling into existing Cookery series groups'
          git push origin HEAD:refs/heads/fix/grilling-creative-groups
