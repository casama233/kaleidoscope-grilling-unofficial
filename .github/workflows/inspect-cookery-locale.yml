name: Inspect Cookery Guide Locale Contract
on:
  push:
    branches:
      - fix/guide-a116-host-locale
    paths:
      - '.github/workflows/inspect-cookery-locale.yml'
      - 'development/guide/inspect_cookery_locale.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'casama233/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Read exact commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/casama233/kaleidoscope-grilling-unofficial.git
          git fetch --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Download pinned Cookery 1.0.6
        shell: pwsh
        run: |
          $p=Join-Path $env:RUNNER_TEMP 'Cookery106.mcaddon'
          Invoke-WebRequest 'https://mediafilez.forgecdn.net/files/8908/596/Kaleidoscope%20Cookery%20v1.0.6.mcaddon' -OutFile $p
          if ((Get-FileHash $p -Algorithm SHA256).Hash.ToLower() -ne 'c589efb60277bea295ac12ef760d8f2c7e8af3ea62e809b320862bd786033351') { throw 'Cookery checksum mismatch' }
          python development/guide/inspect_cookery_locale.py $p
