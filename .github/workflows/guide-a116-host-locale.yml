name: Guide A1.16 Per-Player Locale Compat

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/guide-a116-host-locale.yml'
      - 'development/guide/augment_a116.py'
      - 'development/guide/verify_a116.py'
      - 'development/guide/patch_cookery106_guide_locale.py'
      - 'development/guide/verify_cookery106_guide_locale_compat.py'
      - 'docs/STATUS-GUIDE-A1.16-HOST-LOCALE.md'
  pull_request:
    paths:
      - '.github/workflows/guide-a116-host-locale.yml'
      - 'development/guide/augment_a116.py'
      - 'development/guide/verify_a116.py'
      - 'development/guide/patch_cookery106_guide_locale.py'
      - 'development/guide/verify_cookery106_guide_locale_compat.py'
      - 'docs/STATUS-GUIDE-A1.16-HOST-LOCALE.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grilling-guide-a116-${{ github.ref }}
  cancel-in-progress: false

jobs:
  a116:
    if: github.repository == 'casama233/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440'
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Read exact confirmed repository commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'casama233/kaleidoscope-grilling-unofficial'
          test "$GITHUB_REPOSITORY_ID" = '1377218440'
          git init .
          git config core.autocrlf false
          git remote add origin https://github.com/casama233/kaleidoscope-grilling-unofficial.git
          git fetch --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify published Guide A1.15 baseline
        shell: pwsh
        run: |
          python development/guide/verify_a115.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply and verify Guide A1.16
        shell: pwsh
        run: |
          python development/guide/augment_a116.py
          python development/guide/verify_a116.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download checksum-pinned Cookery 1.0.6
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $cookery=Join-Path $env:RUNNER_TEMP 'Kaleidoscope_Cookery_v1.0.6.mcaddon'
          Invoke-WebRequest 'https://mediafilez.forgecdn.net/files/8908/596/Kaleidoscope%20Cookery%20v1.0.6.mcaddon' -OutFile $cookery
          if ((Get-FileHash $cookery -Algorithm SHA256).Hash.ToLower() -ne 'c589efb60277bea295ac12ef760d8f2c7e8af3ea62e809b320862bd786033351') { throw 'Cookery checksum mismatch' }

      - name: Build and verify Cookery locale compat host
        shell: pwsh
        run: |
          $cookery=Join-Path $env:RUNNER_TEMP 'Kaleidoscope_Cookery_v1.0.6.mcaddon'
          python development/guide/patch_cookery106_guide_locale.py $cookery artifacts/Kaleidoscope_Cookery_v1.0.6_Grilling_Guide_Locale_Compat.mcaddon projects/grilling/integration/cookery106/a116-host-compat-report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/guide/verify_cookery106_guide_locale_compat.py $cookery artifacts/Kaleidoscope_Cookery_v1.0.6_Grilling_Guide_Locale_Compat.mcaddon projects/grilling/integration/cookery106/behavior_pack/scripts/payload.js projects/grilling/integration/cookery106/a116-host-compat-report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download checksum-pinned official bridge Dash v1.2.0
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dash=Join-Path $env:RUNNER_TEMP 'dash.exe'
          Invoke-WebRequest 'https://github.com/bridge-core/deno-dash-compiler/releases/download/v1.2.0/dash.exe' -OutFile $dash
          if ((Get-FileHash $dash -Algorithm SHA256).Hash.ToLower() -ne '00bb6d984f0ffb819e2fb26c1eda5768db2d6e07a979712e34e1c76c2b7594de') { throw 'Dash checksum mismatch' }

      - name: Compile Guide A1.16
        working-directory: projects/grilling/integration/cookery106
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/dash.exe" build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compare compiled Guide A1.16
        shell: pwsh
        run: |
          python development/guide/verify_a116.py --compiled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Guide A1.16
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import hashlib,json,os,shutil,zipfile
          root=Path('.');p=root/'projects/grilling/integration/cookery106';art=root/'artifacts';art.mkdir(exist_ok=True)
          def load(x):return json.loads(x.read_text(encoding='utf-8-sig'))
          packs={}
          for name in ('behavior_pack','resource_pack'):
              src=p/name;uid=load(src/'manifest.json')['header']['uuid']
              found=[x.parent for x in (p/'builds/dist').rglob('manifest.json') if load(x).get('header',{}).get('uuid')==uid]
              assert len(found)==1,(name,found);packs[name]=found[0]
          mc=art/'Grilling_Guide_Cookery106_A1.16_Per_Player_Locale.mcaddon'
          with zipfile.ZipFile(mc,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for name,pack in packs.items():
                  for f in sorted(pack.rglob('*')):
                      if f.is_file():z.write(f,name+'/'+f.relative_to(pack).as_posix())
          with zipfile.ZipFile(mc) as z:assert z.testzip() is None
          br=art/'Grilling_Guide_Cookery106_A1.16_Per_Player_Locale.brproject'
          with zipfile.ZipFile(br,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for f in sorted(p.rglob('*')):
                  rel=f.relative_to(p)
                  if f.is_file() and 'builds' not in rel.parts and '.bridge' not in rel.parts:z.write(f,rel.as_posix())
          compat=art/'Kaleidoscope_Cookery_v1.0.6_Grilling_Guide_Locale_Compat.mcaddon'
          result={
            'guide_version':'A1.16','tested_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
            'guide_entries':33,'localized_body_locales':['zh_CN','zh_TW','en_US'],'mechanics_by_locale_entries':33,
            'per_player_language_property':'kc:guidebook_language','per_player_language_isolation':True,
            'cookery_compat_host_required':True,'cookery_compat_host_sha256':hashlib.sha256(compat.read_bytes()).hexdigest(),
            'guide_mcaddon_sha256':hashlib.sha256(mc.read_bytes()).hexdigest(),'guide_brproject_sha256':hashlib.sha256(br.read_bytes()).hexdigest(),
            'dash_compiled_and_compared':True,'minecraft_tested':False,'bds_tested':False
          }
          (p/'a116-ci-result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          for q in (p/'builds',p/'.bridge'):
              if q.exists():shutil.rmtree(q)
          '@ | python -

      - name: Publish Guide A1.16 and compat host
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- projects/grilling/integration/cookery106 artifacts/Grilling_Guide_Cookery106_A1.16_Per_Player_Locale.mcaddon artifacts/Grilling_Guide_Cookery106_A1.16_Per_Player_Locale.brproject artifacts/Kaleidoscope_Cookery_v1.0.6_Grilling_Guide_Locale_Compat.mcaddon
          git diff --cached --name-only | python -c 'import sys; p=sys.stdin.read().splitlines(); ok=("projects/grilling/integration/cookery106/","artifacts/Grilling_Guide_Cookery106_A1.16_Per_Player_Locale.","artifacts/Kaleidoscope_Cookery_v1.0.6_Grilling_Guide_Locale_Compat.mcaddon"); assert p and all(x.startswith(ok) for x in p)'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: publish Guide A1.16 per-player locale compat'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:main
          unset AUTH

      - name: Upload Guide A1.16 review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Grilling-Guide-A1.16-Per-Player-Locale
          path: |
            artifacts/Grilling_Guide_Cookery106_A1.16_Per_Player_Locale.mcaddon
            artifacts/Grilling_Guide_Cookery106_A1.16_Per_Player_Locale.brproject
            artifacts/Kaleidoscope_Cookery_v1.0.6_Grilling_Guide_Locale_Compat.mcaddon
            projects/grilling/integration/cookery106/a116-*.json
          retention-days: 14
          if-no-files-found: error
