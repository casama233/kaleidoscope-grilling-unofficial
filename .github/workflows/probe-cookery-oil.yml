name: Probe Cookery Oil Pot Contract
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-cookery-oil.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'casama233/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Read exact confirmed repository commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/casama233/kaleidoscope-grilling-unofficial.git
          git fetch --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Inspect pinned Cookery oil-pot scripts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $cookery=Join-Path $env:RUNNER_TEMP 'Cookery.mcaddon'
          Invoke-WebRequest 'https://mediafilez.forgecdn.net/files/8908/596/Kaleidoscope%20Cookery%20v1.0.6.mcaddon' -OutFile $cookery
          if ((Get-FileHash $cookery -Algorithm SHA256).Hash.ToLower() -ne 'c589efb60277bea295ac12ef760d8f2c7e8af3ea62e809b320862bd786033351') { throw 'Cookery checksum mismatch' }
          @'
          import zipfile,re,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          with zipfile.ZipFile(p) as z:
              for suffix in ('[BP]/scripts/custom_components/blocks/oilPot.js','[BP]/scripts/events/replaceablePlacement.js'):
                  name=next(n for n in z.namelist() if n.endswith(suffix))
                  text=z.read(name).decode('utf-8')
                  print('===== '+name+' =====')
                  lines=text.splitlines()
                  for i,line in enumerate(lines,1):
                      if any(k.lower() in line.lower() for k in ('kc_oil_count','oil_pot_filled','oil_pot','256','64','setDynamicProperty','getDynamicProperty','oil count','oil_count')):
                          a=max(1,i-3);b=min(len(lines),i+3)
                          print(f'--- lines {a}-{b} ---')
                          for j in range(a,b+1):print(f'{j}: {lines[j-1]}')
          '@ | python - $cookery
