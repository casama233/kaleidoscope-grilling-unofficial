name: Verify and add plant assets
on:
  push:
    paths:
      - '.github/workflows/add-plants.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: grilling-asset-import
  cancel-in-progress: false
jobs:
  plants:
    if: github.repository == 'casama233/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read exact public commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'casama233/kaleidoscope-grilling-unofficial'
          test "$GITHUB_REPOSITORY_ID" = '1377218440'
          git init .
          git remote add origin https://github.com/casama233/kaleidoscope-grilling-unofficial.git
          git fetch --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install deterministic rendering dependencies
        run: python -m pip install 'numpy==2.3.5' 'Pillow==12.3.0'
      - name: Add sources, lower templates, preserve baseline and run eight-view comparisons
        run: python development/add_plants.py
      - name: Commit verified plant assets only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'casama233/kaleidoscope-grilling-unofficial'
          test "$GITHUB_REPOSITORY_ID" = '1377218440'
          find projects/grilling -type d -name __pycache__ -prune -exec rm -rf {} +
          git add -- projects/grilling
          git diff --cached --name-only | python -c 'import sys; p=sys.stdin.read().splitlines(); assert p and all(n.startswith("projects/grilling/") for n in p)'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'assets: add 11 fish-mint stages and 4 pepper parts with 120 eight-view comparisons'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:main
          unset AUTH
