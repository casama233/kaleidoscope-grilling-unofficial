name: A2.7.8 Cookery Board Probe
on:
  push:
    branches: [a278-basic-chopping-1]
    paths:
      - '.github/workflows/a278-cookery-board-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect exact public Cookery 1.0.6 board runtime
        shell: bash
        run: |
          set -euo pipefail
          expected='c589efb60277bea295ac12ef760d8f2c7e8af3ea62e809b320862bd786033351'
          url='https://mediafilez.forgecdn.net/files/8908/596/Kaleidoscope%20Cookery%20v1.0.6.mcaddon'
          curl --retry 2 -fL --connect-timeout 15 --max-time 120 "$url" -o cookery.mcaddon
          test "$(sha256sum cookery.mcaddon | awk '{print $1}')" = "$expected"
          python - <<'PY'
          import io,zipfile
          needles=(
            b'getExtensionBoardRecipe',
            b'chopping_board_craft',
            b'extensionBoard',
            b'raw_cow_offal',
            b'kc_chopping_food_0',
          )
          hits=[]
          def scan(z,prefix=''):
              for n in z.namelist():
                  data=z.read(n)
                  if n.lower().endswith(('.mcpack','.zip')):
                      try: scan(zipfile.ZipFile(io.BytesIO(data)),prefix+n+'!')
                      except zipfile.BadZipFile: pass
                  if not n.lower().endswith(('.js','.json','.md','.txt')): continue
                  if any(k in data for k in needles):
                      text=data.decode('utf-8','replace')
                      # Print only likely board/runtime files or the exact built-in recipe.
                      if ('chopp' in n.lower() or 'board' in n.lower() or
                          'stationRecipes' in n or 'extensionRegistry' in n or
                          'raw_cow_offal' in text and n.lower().endswith('.js')):
                          hits.append((prefix+n,text))
          with zipfile.ZipFile('cookery.mcaddon') as z:scan(z)
          for p,text in hits:
              print(f'\n===== BEGIN {p} =====')
              if len(text)>50000:
                  lines=text.splitlines()
                  keep=[]
                  for i,line in enumerate(lines):
                      if any(k.decode() in line for k in needles):
                          keep.extend(lines[max(0,i-18):i+30])
                          keep.append('---')
                  print('\n'.join(keep))
              else:
                  print(text)
              print(f'===== END {p} =====')
          print('FILES=',len(hits))
          PY
