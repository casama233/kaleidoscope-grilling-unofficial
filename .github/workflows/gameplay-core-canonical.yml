name: Canonical Gameplay Core

on:
  pull_request:
    paths:
      - '.github/workflows/gameplay-core-canonical.yml'
      - 'projects/grilling/gameplay_core/**'
      - 'tools/check_grilling_release.py'
      - 'tools/audit_grilling_render.py'
      - 'tools/build_grilling_release.py'
      - 'docs/RUNTIME-ARCHITECTURE.md'
      - 'docs/STATUS-A2.7.61.md'
      - 'docs/STATUS-A2.7.62.md'
      - 'docs/STATUS-A2.7.63.md'
      - 'docs/STATUS-A2.7.64.md'
      - 'docs/RENDER-AUDIT-A2.7.62.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gameplay-core-canonical.yml'
      - 'projects/grilling/gameplay_core/**'
      - 'tools/check_grilling_release.py'
      - 'tools/audit_grilling_render.py'
      - 'tools/build_grilling_release.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grilling-canonical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical:
    if: github.repository == 'casama233/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Read exact repository commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'casama233/kaleidoscope-grilling-unofficial'
          test "$GITHUB_REPOSITORY_ID" = '1377218440'
          git init .
          git config core.autocrlf false
          git remote add origin https://github.com/casama233/kaleidoscope-grilling-unofficial.git
          git fetch --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Check canonical runtime
        shell: pwsh
        run: |
          python tools/check_grilling_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit canonical render chain
        shell: pwsh
        run: |
          python tools/audit_grilling_render.py --fail-on-error --json "$env:RUNNER_TEMP/grilling-render-audit.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download checksum-pinned official bridge Dash v1.2.0
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dash=Join-Path $env:RUNNER_TEMP 'dash.exe'
          Invoke-WebRequest 'https://github.com/bridge-core/deno-dash-compiler/releases/download/v1.2.0/dash.exe' -OutFile $dash
          if ((Get-FileHash $dash -Algorithm SHA256).Hash.ToLower() -ne '00bb6d984f0ffb819e2fb26c1eda5768db2d6e07a979712e34e1c76c2b7594de') { throw 'Dash checksum mismatch' }

      - name: Compile canonical Gameplay Core
        working-directory: projects/grilling/gameplay_core
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/dash.exe" build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compare compiled output to canonical source
        shell: pwsh
        run: |
          python tools/check_grilling_release.py --compiled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build deterministic candidate addon
        shell: pwsh
        run: |
          python tools/build_grilling_release.py --output "$env:RUNNER_TEMP/Kaleidoscope_Grilling_Canonical.mcaddon"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload canonical review artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Kaleidoscope-Grilling-Canonical-${{ github.sha }}
          path: |
            ${{ runner.temp }}/Kaleidoscope_Grilling_Canonical.mcaddon
            ${{ runner.temp }}/Kaleidoscope_Grilling_Canonical.mcaddon.sha256
            ${{ runner.temp }}/grilling-render-audit.json
          retention-days: 14
          if-no-files-found: error
          overwrite: true
