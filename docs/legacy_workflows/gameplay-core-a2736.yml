name: A2.7.36 Typed Cookery Oil Pot Block
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gameplay-core-a2736.yml'
      - 'development/gameplay_core/a2736_typed_oil_pot_block_*.js'
      - 'development/gameplay_core/test_a2736_*.mjs'
      - 'development/gameplay_core/verify_a2736*.py'
      - 'development/gameplay_core/augment_a2736.py'
      - 'docs/STATUS-A2.7.36.md'
  pull_request:
    paths:
      - '.github/workflows/gameplay-core-a2736.yml'
      - 'development/gameplay_core/a2736_typed_oil_pot_block_*.js'
      - 'development/gameplay_core/test_a2736_*.mjs'
      - 'development/gameplay_core/verify_a2736*.py'
      - 'development/gameplay_core/augment_a2736.py'
      - 'docs/STATUS-A2.7.36.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: grilling-gameplay-core-a2736-${{ github.ref }}
  cancel-in-progress: false

jobs:
  a2736:
    if: github.repository == 'casama233/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Read exact confirmed repository commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'casama233/kaleidoscope-grilling-unofficial'
          test "$GITHUB_REPOSITORY_ID" = '1377218440'
          git init .
          git config core.autocrlf false
          git remote add origin https://github.com/casama233/kaleidoscope-grilling-unofficial.git
          git fetch --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify published A2.7.35 baseline
        shell: pwsh
        run: |
          python development/gameplay_core/verify_a2735.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify pinned Java and Cookery block contracts
        shell: pwsh
        run: |
          python development/gameplay_core/verify_a2736_java_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ErrorActionPreference='Stop'
          $cookery=Join-Path $env:RUNNER_TEMP 'Kaleidoscope_Cookery_v1.0.6.mcaddon'
          Invoke-WebRequest 'https://mediafilez.forgecdn.net/files/8908/596/Kaleidoscope%20Cookery%20v1.0.6.mcaddon' -OutFile $cookery
          if ((Get-FileHash $cookery -Algorithm SHA256).Hash.ToLower() -ne 'c589efb60277bea295ac12ef760d8f2c7e8af3ea62e809b320862bd786033351') { throw 'Cookery checksum mismatch' }
          python development/gameplay_core/verify_a2736_cookery_contract.py $cookery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify A2.7.36 pure block bridge logic
        shell: pwsh
        run: |
          node development/gameplay_core/test_a2736_core.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply and verify A2.7.36
        shell: pwsh
        run: |
          python development/gameplay_core/augment_a2736.py
          python development/gameplay_core/verify_a2736.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download checksum-pinned official bridge Dash v1.2.0
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dash=Join-Path $env:RUNNER_TEMP 'dash.exe'
          Invoke-WebRequest 'https://github.com/bridge-core/deno-dash-compiler/releases/download/v1.2.0/dash.exe' -OutFile $dash
          if ((Get-FileHash $dash -Algorithm SHA256).Hash.ToLower() -ne '00bb6d984f0ffb819e2fb26c1eda5768db2d6e07a979712e34e1c76c2b7594de') { throw 'Dash checksum mismatch' }

      - name: Compile A2.7.36 with official Dash
        working-directory: projects/grilling/gameplay_core
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/dash.exe" build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compare real Dash outputs
        shell: pwsh
        run: |
          python development/gameplay_core/verify_a2736.py --compiled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package A2.7.36 addon
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import hashlib,json,os,shutil,zipfile
          root=Path('.');p=root/'projects/grilling/gameplay_core';art=root/'artifacts';art.mkdir(exist_ok=True)
          def load(x):return json.loads(x.read_text(encoding='utf-8-sig'))
          packs={}
          for name in ('behavior_pack','resource_pack'):
              src=p/name;uid=load(src/'manifest.json')['header']['uuid']
              found=[x.parent for x in (p/'builds/dist').rglob('manifest.json') if load(x).get('header',{}).get('uuid')==uid]
              assert len(found)==1,(name,found);packs[name]=found[0]
          mc=art/'Kaleidoscope_Grilling_A2.7.36_Typed_Cookery_Oil_Pot_Block.mcaddon'
          with zipfile.ZipFile(mc,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for name,pack in packs.items():
                  for f in sorted(pack.rglob('*')):
                      if f.is_file():z.write(f,name+'/'+f.relative_to(pack).as_posix())
          with zipfile.ZipFile(mc) as z:assert z.testzip() is None
          br=art/'Kaleidoscope_Grilling_A2.7.36_Typed_Cookery_Oil_Pot_Block.brproject'
          with zipfile.ZipFile(br,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for f in sorted(p.rglob('*')):
                  rel=f.relative_to(p)
                  if f.is_file() and 'builds' not in rel.parts and '.bridge' not in rel.parts:z.write(f,rel.as_posix())
          result={
            'version':'A2.7.36','tested_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
            'incremental_from_published_a2735':True,'typed_oil_pot_block_bridge':True,'uses_cookery_host_block':True,
            'reuses_a2735_player_io':True,'typed_capacity':64,'bucket_points':8,
            'player_break_preserves_type':True,'explosion_preserves_type':True,'host_duplicate_drop_avoided':True,
            'dash_compiled_and_compared':True,'mcaddon_sha256':hashlib.sha256(mc.read_bytes()).hexdigest(),
            'brproject_sha256':hashlib.sha256(br.read_bytes()).hexdigest(),'minecraft_tested':False,'bds_tested':False
          }
          (p/'reports'/'a2736-ci-result.json').write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          for q in (p/'builds',p/'.bridge'):
              if q.exists():shutil.rmtree(q)
          '@ | python -

      - name: Publish A2.7.36 generated project and artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- projects/grilling/gameplay_core artifacts/Kaleidoscope_Grilling_A2.7.36_Typed_Cookery_Oil_Pot_Block.mcaddon artifacts/Kaleidoscope_Grilling_A2.7.36_Typed_Cookery_Oil_Pot_Block.brproject
          git diff --cached --name-only | python -c 'import sys; p=sys.stdin.read().splitlines(); ok=("projects/grilling/gameplay_core/","artifacts/Kaleidoscope_Grilling_A2.7.36_Typed_Cookery_Oil_Pot_Block."); assert p and all(x.startswith(ok) for x in p)'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: publish A2.7.36 typed Cookery oil-pot block bridge'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:main
          unset AUTH

      - name: Upload A2.7.36 review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Kaleidoscope-Grilling-A2.7.36-Typed-Cookery-Oil-Pot-Block
          path: |
            artifacts/Kaleidoscope_Grilling_A2.7.36_Typed_Cookery_Oil_Pot_Block.mcaddon
            artifacts/Kaleidoscope_Grilling_A2.7.36_Typed_Cookery_Oil_Pot_Block.brproject
            projects/grilling/gameplay_core/reports/
          retention-days: 14
          if-no-files-found: error
