name: A2.0 Gameplay Core
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: grilling-gameplay-core-a20
  cancel-in-progress: false
jobs:
  core:
    if: github.repository == 'casama233/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Read exact confirmed repository commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'casama233/kaleidoscope-grilling-unofficial'
          test "$GITHUB_REPOSITORY_ID" = '1377218440'
          git init .
          git config core.autocrlf false
          git remote add origin https://github.com/casama233/kaleidoscope-grilling-unofficial.git
          git fetch --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Test Java-parity grill state machine
        shell: pwsh
        run: |
          node development/gameplay_core/test_core.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate formal A2.0 BP/RP from pinned Java sources
        shell: pwsh
        run: |
          python development/gameplay_core/build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute generated gameplay runtime in mock Bedrock host
        shell: pwsh
        run: |
          node --experimental-vm-modules development/gameplay_core/test_runtime.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate formal items, grill block and retail API boundary
        shell: pwsh
        run: |
          python development/gameplay_core/verify.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download checksum-pinned official bridge Dash v1.2.0
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dash=Join-Path $env:RUNNER_TEMP 'dash.exe'
          Invoke-WebRequest 'https://github.com/bridge-core/deno-dash-compiler/releases/download/v1.2.0/dash.exe' -OutFile $dash
          if ((Get-FileHash $dash -Algorithm SHA256).Hash.ToLower() -ne '00bb6d984f0ffb819e2fb26c1eda5768db2d6e07a979712e34e1c76c2b7594de') { throw 'Dash checksum mismatch' }
      - name: Compile A2.0 formal gameplay project with Dash
        working-directory: projects/grilling/gameplay_core
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/dash.exe" build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compare real Dash output against generated project
        shell: pwsh
        run: |
          python development/gameplay_core/verify.py --compiled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package verified gameplay addon and bridge project
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import hashlib,json,os,shutil,zipfile
          root=Path('.');p=root/'projects/grilling/gameplay_core';art=root/'artifacts';art.mkdir(exist_ok=True)
          def load(x):return json.loads(x.read_text(encoding='utf-8-sig'))
          packs={}
          for name in ('behavior_pack','resource_pack'):
              src=p/name;uid=load(src/'manifest.json')['header']['uuid']
              found=[x.parent for x in (p/'builds/dist').rglob('manifest.json') if load(x).get('header',{}).get('uuid')==uid]
              assert len(found)==1,(name,found);packs[name]=found[0]
          mc=art/'Kaleidoscope_Grilling_A2.0_Gameplay_Core.mcaddon'
          with zipfile.ZipFile(mc,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for name,pack in packs.items():
                  for f in sorted(pack.rglob('*')):
                      if f.is_file():z.write(f,name+'/'+f.relative_to(pack).as_posix())
          with zipfile.ZipFile(mc) as z:assert z.testzip() is None
          br=art/'Kaleidoscope_Grilling_A2.0_Gameplay_Core.brproject'
          with zipfile.ZipFile(br,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for f in sorted(p.rglob('*')):
                  rel=f.relative_to(p)
                  if f.is_file() and 'builds' not in rel.parts and '.bridge' not in rel.parts:z.write(f,rel.as_posix())
          result={
            'version':'A2.0.0','tested_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
            'retail_target':'Bedrock 26.51 / content 1.26.50','server_module':'2.9.0',
            'cookery_1_0_6_dependency':True,'dash_compiled_and_compared':True,
            'core_state_tests':True,'mock_runtime_tests':True,
            'mcaddon_sha256':hashlib.sha256(mc.read_bytes()).hexdigest(),
            'brproject_sha256':hashlib.sha256(br.read_bytes()).hexdigest(),
            'minecraft_tested':False,'bds_tested':False
          }
          reports=p/'reports';reports.mkdir(exist_ok=True)
          (reports/'ci-result.json').write_text(json.dumps(result,indent=2)+'\n')
          for q in (p/'builds',p/'.bridge'):
              if q.exists():shutil.rmtree(q)
          '@ | python -
      - name: Publish verified A2.0 generated project and artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'casama233/kaleidoscope-grilling-unofficial'
          test "$GITHUB_REPOSITORY_ID" = '1377218440'
          git add -- projects/grilling/gameplay_core artifacts/Kaleidoscope_Grilling_A2.0_Gameplay_Core.mcaddon artifacts/Kaleidoscope_Grilling_A2.0_Gameplay_Core.brproject
          git diff --cached --name-only | python -c 'import sys; p=sys.stdin.read().splitlines(); ok=("projects/grilling/gameplay_core/","artifacts/Kaleidoscope_Grilling_A2.0_Gameplay_Core."); assert p and all(x.startswith(ok) for x in p)'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: publish A2.0 formal three-slot grill and fixed-skewer gameplay core'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:main
          unset AUTH
      - name: Upload A2.0 gameplay artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Kaleidoscope-Grilling-A2.0-Gameplay-Core
          path: |
            artifacts/Kaleidoscope_Grilling_A2.0_Gameplay_Core.mcaddon
            artifacts/Kaleidoscope_Grilling_A2.0_Gameplay_Core.brproject
            projects/grilling/gameplay_core/reports/
          retention-days: 14
          if-no-files-found: error
