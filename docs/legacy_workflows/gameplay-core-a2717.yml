name: A2.7.17 Onion Crop
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gameplay-core-a2717.yml'
      - 'development/gameplay_core/a2717_*'
      - 'development/gameplay_core/augment_a2717.py'
      - 'development/gameplay_core/test_a2717_*'
      - 'development/gameplay_core/verify_a2717*.py'
      - 'docs/STATUS-A2.7.17.md'
  pull_request:
    paths:
      - '.github/workflows/gameplay-core-a2717.yml'
      - 'development/gameplay_core/a2717_*'
      - 'development/gameplay_core/augment_a2717.py'
      - 'development/gameplay_core/test_a2717_*'
      - 'development/gameplay_core/verify_a2717*.py'
      - 'docs/STATUS-A2.7.17.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: grilling-gameplay-core-a2717-${{ github.ref }}
  cancel-in-progress: false
jobs:
  a2717:
    if: github.repository == 'casama233/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440'
    runs-on: windows-latest
    timeout-minutes: 95
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Read exact confirmed repository commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'casama233/kaleidoscope-grilling-unofficial'
          test "$GITHUB_REPOSITORY_ID" = '1377218440'
          git init .
          git config core.autocrlf false
          git remote add origin https://github.com/casama233/kaleidoscope-grilling-unofficial.git
          git fetch --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install pinned render dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "numpy==2.3.3" "Pillow==11.3.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rebuild A2.0 to A2.3
        shell: pwsh
        run: |
          node development/gameplay_core/test_core.mjs
          python development/gameplay_core/build.py
          python development/gameplay_core/augment_a21.py
          node development/gameplay_core/test_a21_core.mjs
          node --experimental-vm-modules development/gameplay_core/test_a21_runtime.mjs
          python development/gameplay_core/verify_a21.py
          python development/gameplay_core/augment_a22.py
          node --experimental-vm-modules development/gameplay_core/test_a22_runtime.mjs
          python development/gameplay_core/verify_a22.py
          node development/gameplay_core/test_a23_hot_merge.mjs
          python development/gameplay_core/augment_a23.py
          node --experimental-vm-modules development/gameplay_core/test_a23_runtime.mjs
          python development/gameplay_core/verify_a23.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rebuild A2.4 to A2.6
        shell: pwsh
        run: |
          node development/gameplay_core/test_a24_core.mjs
          python development/gameplay_core/augment_a24.py
          python development/gameplay_core/verify_a24.py
          node development/gameplay_core/test_a25_core.mjs
          python development/gameplay_core/augment_a25.py
          python development/gameplay_core/verify_a25.py
          node development/gameplay_core/test_a26_core.mjs
          python development/gameplay_core/augment_a26.py
          python development/gameplay_core/verify_a26.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rebuild A2.7.1 to A2.7.4
        shell: pwsh
        run: |
          node development/gameplay_core/test_a271_core.mjs
          python development/gameplay_core/augment_a271.py
          python development/gameplay_core/verify_a271.py
          node development/gameplay_core/test_a272_core.mjs
          python development/gameplay_core/augment_a272.py
          python development/gameplay_core/verify_a272.py
          python development/gameplay_core/augment_a273.py
          python development/gameplay_core/verify_a273.py
          python development/gameplay_core/augment_a274.py
          python development/gameplay_core/verify_a274.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rebuild A2.7.5
        shell: pwsh
        run: |
          node development/gameplay_core/test_a275_core.mjs
          python development/gameplay_core/augment_a275.py
          python development/gameplay_core/verify_a275.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rebuild A2.7.6 intent and hand parity
        shell: pwsh
        run: |
          node development/gameplay_core/test_a276_core.mjs
          python development/gameplay_core/augment_a276.py
          python development/gameplay_core/verify_a276.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rebuild A2.7.7 transaction rollback
        shell: pwsh
        run: |
          node development/gameplay_core/test_a277_core.mjs
          python development/gameplay_core/augment_a277.py
          python development/gameplay_core/verify_a277.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rebuild A2.7.8 conflict-free basic chopping I
        shell: pwsh
        run: |
          node development/gameplay_core/test_a278_core.mjs
          python development/gameplay_core/augment_a278.py
          python development/gameplay_core/verify_a278.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rebuild A2.7.9 beef board override
        shell: pwsh
        run: |
          node development/gameplay_core/test_a279_core.mjs
          python development/gameplay_core/augment_a279.py
          python development/gameplay_core/verify_a279.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply A2.7.10 chicken acquisition
        shell: pwsh
        run: |
          node development/gameplay_core/test_a2710_core.mjs
          python development/gameplay_core/augment_a2710.py
          python development/gameplay_core/verify_a2710.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply A2.7.11 mantou chopping
        shell: pwsh
        run: |
          node development/gameplay_core/test_a2711_core.mjs
          python development/gameplay_core/augment_a2711.py
          python development/gameplay_core/verify_a2711.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply A2.7.12 remaining knife drops
        shell: pwsh
        run: |
          node development/gameplay_core/test_a2712_core.mjs
          python development/gameplay_core/augment_a2712.py
          python development/gameplay_core/verify_a2712.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply A2.7.13 houttuynia processing
        shell: pwsh
        run: |
          node development/gameplay_core/test_a2713_core.mjs
          python development/gameplay_core/augment_a2713.py
          python development/gameplay_core/verify_a2713.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply A2.7.14 houttuynia crop
        shell: pwsh
        run: |
          node development/gameplay_core/test_a2714_core.mjs
          python development/gameplay_core/verify_a2714_java_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/gameplay_core/augment_a2714.py
          python development/gameplay_core/verify_a2714.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply A2.7.15 canola crop
        shell: pwsh
        run: |
          node development/gameplay_core/test_a2715_core.mjs
          python development/gameplay_core/verify_a2715_java_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/gameplay_core/augment_a2715.py
          python development/gameplay_core/verify_a2715.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply A2.7.16 canola processing
        shell: pwsh
        run: |
          node development/gameplay_core/test_a2716_core.mjs
          python development/gameplay_core/verify_a2716_java_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/gameplay_core/augment_a2716.py
          python development/gameplay_core/verify_a2716.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply A2.7.17 onion crop
        shell: pwsh
        run: |
          node development/gameplay_core/test_a2717_core.mjs
          python development/gameplay_core/verify_a2717_java_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/gameplay_core/augment_a2717.py
          python development/gameplay_core/verify_a2717.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify exact Cookery 1.0.6 chicken + mantou + raw offal + houttuynia + straw-hat + millstone contracts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $cookery=Join-Path $env:RUNNER_TEMP 'Kaleidoscope_Cookery_v1.0.6.mcaddon'
          Invoke-WebRequest 'https://mediafilez.forgecdn.net/files/8908/596/Kaleidoscope%20Cookery%20v1.0.6.mcaddon' -OutFile $cookery
          if ((Get-FileHash $cookery -Algorithm SHA256).Hash.ToLower() -ne 'c589efb60277bea295ac12ef760d8f2c7e8af3ea62e809b320862bd786033351') { throw 'Cookery checksum mismatch' }
          python development/gameplay_core/verify_a2710_cookery_contract.py $cookery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/gameplay_core/verify_a2711_cookery_contract.py $cookery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/gameplay_core/verify_a2712_cookery_contract.py $cookery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/gameplay_core/verify_a2713_cookery_contract.py $cookery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/gameplay_core/verify_a2715_cookery_contract.py $cookery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/gameplay_core/verify_a2716_cookery_contract.py $cookery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download checksum-pinned official bridge Dash v1.2.0
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dash=Join-Path $env:RUNNER_TEMP 'dash.exe'
          Invoke-WebRequest 'https://github.com/bridge-core/deno-dash-compiler/releases/download/v1.2.0/dash.exe' -OutFile $dash
          if ((Get-FileHash $dash -Algorithm SHA256).Hash.ToLower() -ne '00bb6d984f0ffb819e2fb26c1eda5768db2d6e07a979712e34e1c76c2b7594de') { throw 'Dash checksum mismatch' }

      - name: Compile A2.7.17 with official Dash
        working-directory: projects/grilling/gameplay_core
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/dash.exe" build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compare real Dash outputs
        shell: pwsh
        run: |
          python development/gameplay_core/verify_a2717.py --compiled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package A2.7.17 addon
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import hashlib,json,os,shutil,zipfile
          root=Path('.');p=root/'projects/grilling/gameplay_core';art=root/'artifacts';art.mkdir(exist_ok=True)
          def load(x):return json.loads(x.read_text(encoding='utf-8-sig'))
          packs={}
          for name in ('behavior_pack','resource_pack'):
              src=p/name;uid=load(src/'manifest.json')['header']['uuid']
              found=[x.parent for x in (p/'builds/dist').rglob('manifest.json') if load(x).get('header',{}).get('uuid')==uid]
              assert len(found)==1,(name,found);packs[name]=found[0]
          mc=art/'Kaleidoscope_Grilling_A2.7.17_Onion_Crop.mcaddon'
          with zipfile.ZipFile(mc,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for name,pack in packs.items():
                  for f in sorted(pack.rglob('*')):
                      if f.is_file():z.write(f,name+'/'+f.relative_to(pack).as_posix())
          with zipfile.ZipFile(mc) as z:assert z.testzip() is None
          br=art/'Kaleidoscope_Grilling_A2.7.17_Onion_Crop.brproject'
          with zipfile.ZipFile(br,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for f in sorted(p.rglob('*')):
                  rel=f.relative_to(p)
                  if f.is_file() and 'builds' not in rel.parts and '.bridge' not in rel.parts:z.write(f,rel.as_posix())
          result={
            'version':'A2.7.17','tested_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
            'onion_item':True,'onion_crop':True,'ages':8,'straw_hat_acquisition':True,
            'compostable_65_percent':True,'mature_fortune_0_3_exact':True,
            'onion_to_powder_processing_complete':False,
            'a2716_canola_chain_preserved':True,'dash_compiled_and_compared':True,
            'mcaddon_sha256':hashlib.sha256(mc.read_bytes()).hexdigest(),
            'brproject_sha256':hashlib.sha256(br.read_bytes()).hexdigest(),
            'minecraft_tested':False,'bds_tested':False
          }
          (p/'reports'/'a2717-ci-result.json').write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          for q in (p/'builds',p/'.bridge'):
              if q.exists():shutil.rmtree(q)
          '@ | python -

      - name: Publish A2.7.17 generated project and artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- projects/grilling/gameplay_core artifacts/Kaleidoscope_Grilling_A2.7.17_Onion_Crop.mcaddon artifacts/Kaleidoscope_Grilling_A2.7.17_Onion_Crop.brproject
          git diff --cached --name-only | python -c 'import sys; p=sys.stdin.read().splitlines(); ok=("projects/grilling/gameplay_core/","artifacts/Kaleidoscope_Grilling_A2.7.17_Onion_Crop."); assert p and all(x.startswith(ok) for x in p)'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: publish A2.7.17 onion crop'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:main
          unset AUTH

      - name: Upload A2.7.17 review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Kaleidoscope-Grilling-A2.7.17-Onion-Crop
          path: |
            artifacts/Kaleidoscope_Grilling_A2.7.17_Onion_Crop.mcaddon
            artifacts/Kaleidoscope_Grilling_A2.7.17_Onion_Crop.brproject
            projects/grilling/gameplay_core/reports/
          retention-days: 14
          if-no-files-found: error
