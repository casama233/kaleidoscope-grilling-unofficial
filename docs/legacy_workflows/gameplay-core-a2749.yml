name: A2.7.49 Sugared Tomato + Pepper Honey
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gameplay-core-a2749.yml'
      - 'development/gameplay_core/a2749_*'
      - 'development/gameplay_core/test_a2749*.mjs'
      - 'development/gameplay_core/augment_a2749.py'
      - 'development/gameplay_core/verify_a2749*.py'
      - 'docs/STATUS-A2.7.49.md'
  pull_request:
    paths:
      - '.github/workflows/gameplay-core-a2749.yml'
      - 'development/gameplay_core/a2749_*'
      - 'development/gameplay_core/test_a2749*.mjs'
      - 'development/gameplay_core/augment_a2749.py'
      - 'development/gameplay_core/verify_a2749*.py'
      - 'docs/STATUS-A2.7.49.md'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: grilling-gameplay-core-a2749-${{ github.ref }}
  cancel-in-progress: false

jobs:
  a2749:
    if: github.repository == 'casama233/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Read exact confirmed repository commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'casama233/kaleidoscope-grilling-unofficial'
          test "$GITHUB_REPOSITORY_ID" = '1377218440'
          git init .
          git config core.autocrlf false
          git remote add origin https://github.com/casama233/kaleidoscope-grilling-unofficial.git
          git fetch --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Detect source or published A2.7.49 mode
        id: mode
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $version = python -c "import json; print('.'.join(map(str,json.load(open('projects/grilling/gameplay_core/behavior_pack/manifest.json',encoding='utf-8-sig'))['header']['version'])))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($version -eq '2.7.48') { $mode='source' }
          elseif ($version -eq '2.7.49') { $mode='published' }
          else { throw "Unsupported A2.7.49 workflow baseline: $version" }
          "value=$mode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "A2.7.49 workflow mode: $mode ($version)"

      - name: Verify published A2.7.48 baseline
        if: steps.mode.outputs.value == 'source'
        shell: pwsh
        run: |
          python development/gameplay_core/verify_a2748.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify pinned Java Sugared Tomato + Pepper Honey contract
        shell: pwsh
        run: |
          python development/gameplay_core/verify_a2749_java_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify pinned Cookery tomato host contract
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $cookery=Join-Path $env:RUNNER_TEMP 'Kaleidoscope_Cookery_v1.0.6.mcaddon'
          Invoke-WebRequest 'https://mediafilez.forgecdn.net/files/8908/596/Kaleidoscope%20Cookery%20v1.0.6.mcaddon' -OutFile $cookery
          if ((Get-FileHash $cookery -Algorithm SHA256).Hash.ToLower() -ne 'c589efb60277bea295ac12ef760d8f2c7e8af3ea62e809b320862bd786033351') { throw 'Cookery checksum mismatch' }
          python development/gameplay_core/verify_a2749_cookery_contract.py $cookery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify A2.7.49 pure food/effect core
        shell: pwsh
        run: |
          node development/gameplay_core/test_a2749_core.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply and verify A2.7.49
        if: steps.mode.outputs.value == 'source'
        shell: pwsh
        run: |
          python development/gameplay_core/augment_a2749.py
          python development/gameplay_core/verify_a2749.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify already-published A2.7.49
        if: steps.mode.outputs.value == 'published'
        shell: pwsh
        run: |
          python development/gameplay_core/verify_a2749.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify published A2.7.49 artifact integrity
        if: steps.mode.outputs.value == 'published'
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import hashlib,json,zipfile
          root=Path('.');p=root/'projects/grilling/gameplay_core'
          r=json.loads((p/'reports/a2749-ci-result.json').read_text(encoding='utf-8-sig'))
          artifacts=(
            (root/'artifacts/Kaleidoscope_Grilling_A2.7.49_Sugared_Tomato_Pepper_Honey.mcaddon','mcaddon_sha256'),
            (root/'artifacts/Kaleidoscope_Grilling_A2.7.49_Sugared_Tomato_Pepper_Honey.brproject','brproject_sha256'),
          )
          for path,key in artifacts:
              assert path.is_file(),path
              actual=hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual==r[key],(path,actual,r[key])
              with zipfile.ZipFile(path) as z:assert z.testzip() is None,path
          print('Published A2.7.49 artifacts: integrity PASS')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download checksum-pinned official bridge Dash v1.2.0
        if: steps.mode.outputs.value == 'source'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dash=Join-Path $env:RUNNER_TEMP 'dash.exe'
          Invoke-WebRequest 'https://github.com/bridge-core/deno-dash-compiler/releases/download/v1.2.0/dash.exe' -OutFile $dash
          if ((Get-FileHash $dash -Algorithm SHA256).Hash.ToLower() -ne '00bb6d984f0ffb819e2fb26c1eda5768db2d6e07a979712e34e1c76c2b7594de') { throw 'Dash checksum mismatch' }

      - name: Compile A2.7.49 with official Dash
        if: steps.mode.outputs.value == 'source'
        working-directory: projects/grilling/gameplay_core
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/dash.exe" build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compare real Dash outputs
        if: steps.mode.outputs.value == 'source'
        shell: pwsh
        run: |
          python development/gameplay_core/verify_a2749.py --compiled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package A2.7.49 addon
        if: steps.mode.outputs.value == 'source'
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import hashlib,json,os,shutil,zipfile
          root=Path('.');p=root/'projects/grilling/gameplay_core';art=root/'artifacts';art.mkdir(exist_ok=True)
          def load(x):return json.loads(x.read_text(encoding='utf-8-sig'))
          packs={}
          for name in ('behavior_pack','resource_pack'):
              src=p/name;uid=load(src/'manifest.json')['header']['uuid']
              found=[x.parent for x in (p/'builds/dist').rglob('manifest.json') if load(x).get('header',{}).get('uuid')==uid]
              assert len(found)==1,(name,found);packs[name]=found[0]
          mc=art/'Kaleidoscope_Grilling_A2.7.49_Sugared_Tomato_Pepper_Honey.mcaddon'
          with zipfile.ZipFile(mc,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for name,pack in packs.items():
                  for f in sorted(pack.rglob('*')):
                      if f.is_file():z.write(f,name+'/'+f.relative_to(pack).as_posix())
          with zipfile.ZipFile(mc) as z:assert z.testzip() is None
          br=art/'Kaleidoscope_Grilling_A2.7.49_Sugared_Tomato_Pepper_Honey.brproject'
          with zipfile.ZipFile(br,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for f in sorted(p.rglob('*')):
                  rel=f.relative_to(p)
                  if f.is_file() and 'builds' not in rel.parts and '.bridge' not in rel.parts:z.write(f,rel.as_posix())
          result={
            'version':'A2.7.49','tested_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
            'incremental_from_published_a2748':True,'sugared_tomato':True,'pepper_honey':True,
            'pepper_honey_numb_ticks':1200,'shared_standalone_effect_runtime_reused':True,
            'wedding_candy_preserved':True,'cookery_tomato_host_reused':True,'catalog_registered':True,
            'dash_compiled_and_compared':True,
            'mcaddon_sha256':hashlib.sha256(mc.read_bytes()).hexdigest(),
            'brproject_sha256':hashlib.sha256(br.read_bytes()).hexdigest(),
            'minecraft_tested':False,'bds_tested':False
          }
          (p/'reports'/'a2749-ci-result.json').write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          for q in (p/'builds',p/'.bridge'):
              if q.exists():shutil.rmtree(q)
          '@ | python -

      - name: Publish A2.7.49 generated project and artifacts
        if: steps.mode.outputs.value == 'source' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- projects/grilling/gameplay_core artifacts/Kaleidoscope_Grilling_A2.7.49_Sugared_Tomato_Pepper_Honey.mcaddon artifacts/Kaleidoscope_Grilling_A2.7.49_Sugared_Tomato_Pepper_Honey.brproject
          git diff --cached --name-only | python -c 'import sys; p=sys.stdin.read().splitlines(); ok=("projects/grilling/gameplay_core/","artifacts/Kaleidoscope_Grilling_A2.7.49_Sugared_Tomato_Pepper_Honey."); assert p and all(x.startswith(ok) for x in p)'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: publish A2.7.49 Sugared Tomato + Pepper Honey'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:main
          unset AUTH

      - name: Upload A2.7.49 review artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Kaleidoscope-Grilling-A2.7.49-Sugared-Tomato-Pepper-Honey
          path: |
            artifacts/Kaleidoscope_Grilling_A2.7.49_Sugared_Tomato_Pepper_Honey.mcaddon
            artifacts/Kaleidoscope_Grilling_A2.7.49_Sugared_Tomato_Pepper_Honey.brproject
            projects/grilling/gameplay_core/reports/
          retention-days: 14
          if-no-files-found: error
          overwrite: true
